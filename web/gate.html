<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0c0b"><title>Những ngày có em — gửi Mox</title><style nonce="%%NONCE%%">
*{box-sizing:border-box}body{margin:0;min-height:100svh;color:#e3d7c0;background:radial-gradient(ellipse at 50% 40%,#55222a55,transparent 56%),#0c0c0b;font:14px/1.8 Arial,sans-serif}main{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:30px 35px}main:before{content:'';position:fixed;inset:16px 24px;border:1px solid #c3a77424;pointer-events:none}.top,.bottom{display:flex;justify-content:space-between;gap:20px;color:#b1a181;font-size:10px;letter-spacing:1.5px}.poster{align-self:center;text-align:center;padding:24px 0}.eyebrow{font-size:9px;letter-spacing:2.7px;color:#a7926a}.star{display:block;font-size:27px;color:#ad8053;margin:12px 0}h1{font:400 clamp(65px,8.5vw,110px)/1.1 Georgia,serif;letter-spacing:-3px;margin:12px 0 18px}h1 em{color:#d8b77c;font-weight:400}.dedication{font:italic 19px/1.8 Georgia,serif;color:#b2a389;margin:18px 0 23px}form{width:min(340px,100%);margin:auto}label{display:block;text-align:left;font-size:10px;color:#baa680;letter-spacing:1px;margin-bottom:8px}.password-field{display:flex;border:1px solid #c9ab6866;background:#c6a16008}input{width:100%;min-width:0;background:transparent;color:#e6d8b8;padding:12px 14px;border:0;font-size:16px;min-height:48px;border-radius:0}input::placeholder{color:#8e826b;font-size:12px}button{cursor:pointer}#show-password{min-width:55px;border:0;border-left:1px solid #c9ab6833;background:transparent;color:#cfb477;font-size:11px}.submit{margin-top:17px;width:100%;min-height:57px;border:1px solid #c9ab686e;background:#c6a16010;color:#e0c493;font:24px/1.5 Georgia,serif;padding:10px 15px}.submit:hover{background:#c6a16022}button:focus-visible,input:focus-visible{outline:2px solid #d8be81;outline-offset:3px}.error{min-height:24px;margin:10px 0 0;color:#edbca5;font-size:12px;line-height:1.8}.note{font-size:10px;color:#94866e;margin:6px 0}.bottom{justify-content:center;font:italic 15px/1.8 Georgia,serif;letter-spacing:0;text-align:center}.top i{font:italic 14px Georgia,serif;letter-spacing:0;margin-left:8px;color:#8f836d}@media(max-width:700px){main{padding:25px 22px}main:before{inset:12px}.top{font-size:7px;gap:12px;letter-spacing:1px}.top i{display:block;font-size:12px;margin:4px 0 0}h1{font-size:clamp(46px,13.5vw,75px);letter-spacing:-2px}.dedication{font-size:17px;margin-block:18px}.eyebrow{font-size:7px;letter-spacing:1.7px}.poster{padding:24px 0}form{max-width:300px}.submit{font-size:22px}.bottom{font-size:12px}}
</style></head><body><main><header class="top"><span>MINH &amp; MOX <i>hai năm bên nhau</i></span><span>MỜI EM CÙNG XEM</span></header><section class="poster" aria-labelledby="gate-title"><span class="eyebrow">VÉ DÀNH CHO EM · 25.11.2026</span><span class="star" aria-hidden="true">✦</span><h1 id="gate-title">Những ngày<br><em>có em.</em></h1><p class="dedication">Anh gom vài tấm ảnh<br>để hai đứa cùng xem lại.</p><form action="/__auth/login" method="post"><input type="hidden" name="next" id="next" value="%%NEXT%%"><label for="password">MẬT KHẨU CỦA HAI ĐỨA</label><div class="password-field"><input id="password" name="password" type="password" placeholder="Nhập mật khẩu…" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required maxlength="128" aria-describedby="gate-error"><button type="button" id="show-password" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button></div><button type="submit" class="submit">Mở cuốn phim <span aria-hidden="true">↗</span></button><p class="error" id="gate-error" role="alert">%%ERROR%%</p><p class="note">Chỉ dành cho em. Mình cùng xem lại nhé.</p></form></section><footer class="bottom">Mox · Đại Đế Tuấn Minh · Sữa</footer></main><script nonce="%%NONCE%%">
const field=document.getElementById('password'),show=document.getElementById('show-password');show.addEventListener('click',()=>{const visible=field.type==='password';field.type=visible?'text':'password';show.textContent=visible?'Ẩn':'Hiện';show.setAttribute('aria-label',visible?'Ẩn mật khẩu':'Hiện mật khẩu');show.setAttribute('aria-pressed',String(visible));});field.addEventListener('input',()=>{document.getElementById('gate-error').textContent='';});if(!location.pathname.startsWith('/__auth/'))document.getElementById('next').value=location.pathname+location.search+location.hash;
</script></body></html>
